<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Expanded MD — Audio Player</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:system-ui,sans-serif}.player{position:relative;aspect-ratio:1/1;width:100%;max-width:460px;overflow:hidden;border-radius:12px;background:#e3e7ed;isolation:isolate}.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:0;border-radius:50%;width:48px;height:48px;background:rgba(255,255,255,.48);color:#24355e;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(2px);box-shadow:0 3px 12px #17203930}.play:hover{background:rgba(255,255,255,.68)}.play:focus-visible,.seek:focus-visible{outline:3px solid #ef649b;outline-offset:3px}.play svg{width:23px;height:23px;fill:currentColor}.controls{position:absolute;bottom:0;left:0;right:0;padding:38px 18px 14px;background:linear-gradient(transparent,rgba(12,22,47,.8));color:white}.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:24px;margin-bottom:12px;pointer-events:none}.wave span{display:block;width:3px;height:var(--h);border-radius:10px;background:#fff;opacity:.9;transform-origin:center}.player.playing .wave span{animation:pulse .7s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes pulse{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}@media(prefers-reduced-motion:reduce){.player.playing .wave span{animation:none}}.seek{display:block;width:100%;height:5px;margin:0;accent-color:#f46a9b;cursor:pointer}.times{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #0009}
</style></head><body>
<div class="player" id="player"><img class="cover" src="The Expanded MD Podcast Cover Art.jpg" alt="The Expanded MD podcast cover"><button class="play" id="toggle" type="button" aria-label="Play audio"><svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><div class="controls"><div class="wave" aria-hidden="true" id="wave"></div><input class="seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek through audio"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div></div><audio id="audio" preload="metadata" src="The Expanded MD - The Witch Wound.mp3"></audio></div>
<script>
(()=>{const a=document.getElementById('audio'),p=document.getElementById('player'),b=document.getElementById('toggle'),ico=document.getElementById('playIcon'),seek=document.getElementById('seek'),cur=document.getElementById('current'),dur=document.getElementById('duration'),wave=document.getElementById('wave');const fmt=t=>Number.isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';for(let i=0;i<36;i++){const s=document.createElement('span');s.style.setProperty('--h',`${5+((i*13+Math.floor(i/3)*7)%20)}px`);s.style.setProperty('--d',`${(i%9)*-0.085}s`);wave.appendChild(s)}function sync(){let playing=!a.paused;p.classList.toggle('playing',playing);b.setAttribute('aria-label',playing?'Pause audio':'Play audio');ico.innerHTML=playing?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>'}b.addEventListener('click',()=>{if(a.paused)a.play().catch(()=>{});else a.pause()});a.addEventListener('play',sync);a.addEventListener('pause',sync);a.addEventListener('loadedmetadata',()=>dur.textContent=fmt(a.duration));a.addEventListener('timeupdate',()=>{cur.textContent=fmt(a.currentTime);seek.value=a.duration?100*a.currentTime/a.duration:0});seek.addEventListener('input',()=>{if(a.duration)a.currentTime=a.duration*Number(seek.value)/100});a.addEventListener('ended',sync);sync()})();
</script></body></html>
